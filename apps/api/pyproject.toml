[project]
name = "heinzel-api"
version = "0.1.0"
description = "Heinzel core API: tenants, identity, permissions, module host"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.163",
    "uvicorn[standard]>=0.54",
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "pyyaml>=6.0",
    "sqlalchemy>=2.1",
    "alembic>=1.20",
    "psycopg[binary]>=3.3",
    "argon2-cffi>=25.1",
    "pyotp>=2.12",
    "cryptography>=46",
    "segno>=1.6",
    "redis>=6",
    "jsonschema>=4.23",
]

[project.scripts]
heinzel = "heinzel_api.cli:main"

[dependency-groups]
dev = ["pytest>=9.2", "httpx2>=2.16", "ruff>=0.17"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/heinzel_api"]

[tool.pytest.ini_options]
pythonpath = ["tests"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
